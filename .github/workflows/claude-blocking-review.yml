name: Claude Blocking Review

# Reusable workflow: blocks PR merges when Claude finds bugs, reliability
# regressions, security issues, or data-loss risks.
#
# v3 (2026-04-28): drops the `--max-turns` cap on the Claude agent — it
# was force-killing reviews mid-run on small/medium diffs because the
# estimator's floor (15 turns) was tighter than reality. Reviews are now
# bounded only by the wall-clock `timeout-minutes` (the hard safety net),
# the prompt's own scope discipline, and the OAuth subscription quota.
# This trades a predictable artificial cap for a more permissive natural
# bound; the previous "Review did not complete (likely exceeded turn
# limit)" failure mode is gone. Subscription billing means unused turns
# are free — generous wall-clock is the right posture.
#
# By default, review parameters are auto-estimated from the PR diff size:
#   - Model: claude-sonnet-4-6 (callers can override)
#   - timeout: 10 + lines/100 minutes (min 10, max 30)
# Callers can override `model` and `timeout_minutes` explicitly. Override
# range for timeout_minutes is 1-30. Removed in v3: the `max_turns` input.
#
# Usage in a caller workflow:
#
#   permissions:
#     contents: read
#     pull-requests: write
#     issues: write
#     id-token: write
#
#   jobs:
#     claude-review:
#       uses: smartwatermelon/github-workflows/.github/workflows/claude-blocking-review.yml@v3
#       with:
#         pr_number: ${{ github.event.pull_request.number }}
#         extra_instructions: |
#           Repo-specific guidance here.
#       secrets:
#         claude_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
#
# The calling job name ("claude-review" above) becomes the required status
# check name: "Claude Blocking Review / claude-review / run-review" in branch protection.
#
# Migration from v2: remove any `max_turns:` input from caller workflows.
# Workflow validation will fail until the input is removed.
#
# Escape hatch: add [skip-claude-review: reason] to the PR body to bypass
# enforcement with an audit trail.

on:
  workflow_call:
    inputs:
      pr_number:
        description: 'Pull request number (pass github.event.pull_request.number)'
        type: number
        required: true
      extra_instructions:
        description: 'Repo-specific instructions appended to the base review prompt'
        type: string
        required: false
        default: ''
      timeout_minutes:
        description: |
          Hard timeout for the Claude review step in minutes (max 30).
          0 = auto-estimate from diff size. Since v3 dropped the
          --max-turns cap, this is the only hard safety net.
        type: number
        required: false
        default: 0
      model:
        description: 'Claude model ID. "auto" = sonnet. Callers can override with a specific model.'
        type: string
        required: false
        default: 'auto'
    secrets:
      claude_oauth_token:
        description: 'Claude Code OAuth token (CLAUDE_CODE_OAUTH_TOKEN secret)'
        required: true

jobs:
  run-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write  # required by claude-code-action for internal authentication

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify caller permissions
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          if ! gh api "repos/${REPO}/pulls/${PR_NUMBER}" --silent 2>/dev/null; then
            echo "::error::Permission check failed."
            echo "::error::The caller workflow must declare top-level permissions:"
            echo "::error::  contents: read, pull-requests: write, issues: write, id-token: write"
            exit 1
          fi

      - name: Validate inputs
        env:
          MODEL: ${{ inputs.model }}
          TIMEOUT: ${{ inputs.timeout_minutes }}
        run: |
          # Validate model: "auto" or alphanumeric/dots/hyphens
          if [ "$MODEL" != "auto" ] && ! echo "$MODEL" | grep -qE '^[a-zA-Z0-9._-]+$'; then
            echo "::error::Invalid model name. Must be 'auto' or match [a-zA-Z0-9._-]+"
            exit 1
          fi
          # Validate timeout_minutes: 0 (auto) or 1-30
          if ! echo "$TIMEOUT" | grep -qE '^[0-9]+$'; then
            echo "::error::timeout_minutes must be a non-negative integer"
            exit 1
          fi
          if [ "$TIMEOUT" -gt 30 ]; then
            echo "::error::timeout_minutes must be between 0 and 30 (0 = auto)"
            exit 1
          fi

      - name: Check for doc-only diff
        id: doc-check
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          # Short-circuit: diffs that only touch docs/meta files don't need a
          # paid Claude review — the BLOCK criteria (bug, reliability regression,
          # security, data-loss) don't apply to prose changes. Skips saves real
          # money per run and eliminates the "3 flakes in a row on a doc-only
          # PR" pattern observed in the 2026-04-17 AAR (kebab-tax#1162).
          #
          # Use the files API (not `gh pr diff --name-only`) so we get the
          # pre-rename path for renamed files. A rename like src/foo.py →
          # docs/foo.md would otherwise only show docs/foo.md (apparent
          # doc-only) while the diff contains full code deletion. We classify
          # the UNION of both paths: the PR is doc-only iff every
          # previous_filename AND every filename matches the allowlist below.
          FILES=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --paginate \
            --jq '.[] | [.previous_filename, .filename] | .[] | select(. != null)' \
            2>/dev/null | sort -u || echo "")
          if [ -z "$FILES" ]; then
            echo "::warning::Could not determine changed files — proceeding with review."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # PRIORITY SKIP — workflow-self-modification.
          # When a PR modifies ANY .github/workflows/*.yml file, the
          # anthropics/claude-code-action refuses to run by design (its
          # security feature: a PR that modifies the reviewer cannot have the
          # reviewer run against itself). Without a skip here, the step fails
          # with a misleading "exceeded turn limit" error after 30s. This
          # case hits EVERY Dependabot-generated PR that bumps the pin, plus
          # any manual caller-workflow edit. Short-circuit cleanly; a real
          # review runs on the next non-workflow PR after merge.
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              .github/workflows/*.yml|.github/workflows/*.yaml)
                echo "::notice::PR modifies .github/workflows/ ($f) — claude-code-action refuses to run by design. Skipping; real review will run on the next non-workflow PR after merge."
                echo "skip=true" >> "$GITHUB_OUTPUT"
                echo "## Claude Code Review" >> "$GITHUB_STEP_SUMMARY"
                echo "**Verdict:** SKIPPED (workflow-self-modification)" >> "$GITHUB_STEP_SUMMARY"
                exit 0
                ;;
            esac
          done <<< "$FILES"

          ALL_DOCS=true
          NON_DOC=""
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              # Explicit NON-DOC exclusions come FIRST — they'd otherwise match
              # the general *.md / *.yml patterns below. These files look meta
              # but have real security impact and must not skip review:
              #   - PULL_REQUEST_TEMPLATE.md: can embed required security
              #     checklists; removing them should not bypass review.
              #   - CODEOWNERS: controls approval authority on code paths.
              #   - dependabot.yml: controls dependency sourcing.
              .github/PULL_REQUEST_TEMPLATE.md|.github/CODEOWNERS|.github/dependabot.yml)
                ALL_DOCS=false; NON_DOC="$f"; break ;;
              # Prose documentation formats. `*.txt` was INTENTIONALLY removed
              # — it matched dependency manifests like requirements.txt,
              # constraints.txt, packages.txt that are code-adjacent and
              # deserve review when they change.
              *.md|*.markdown|*.rst) ;;
              LICENSE|LICENSE.*|COPYING|COPYING.*) ;;
              CHANGELOG|CHANGELOG.*|HISTORY|HISTORY.*|AUTHORS|NOTICE) ;;
              # Build-time meta files with negligible runtime behavior impact.
              .gitignore|.gitattributes|.editorconfig|.mailmap) ;;
              # Image assets (usually README screenshots, docs figures).
              *.png|*.jpg|*.jpeg|*.gif|*.svg|*.webp|*.ico|*.bmp) ;;
              # User-facing issue forms and the Sponsor button config.
              .github/ISSUE_TEMPLATE/*) ;;
              .github/FUNDING.yml) ;;
              # Doc directories at the repo root. Nested doc/ under code paths
              # (e.g. src/docs/) intentionally NOT covered — if a consumer has
              # nested docs they still get reviewed, conservative.
              docs/*|doc/*) ;;
              *) ALL_DOCS=false; NON_DOC="$f"; break ;;
            esac
          done <<< "$FILES"

          if [ "$ALL_DOCS" = "true" ]; then
            FILE_COUNT=$(printf '%s\n' "$FILES" | grep -c .)
            echo "::notice::Doc-only diff (${FILE_COUNT} file(s)) — skipping Claude review."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "## Claude Code Review" >> "$GITHUB_STEP_SUMMARY"
            echo "**Verdict:** SKIPPED (doc-only diff, ${FILE_COUNT} file(s))" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Non-doc file present ('$NON_DOC') — proceeding with review."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Estimate review parameters
        id: estimate
        if: steps.doc-check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          MODEL_INPUT: ${{ inputs.model }}
          TIMEOUT_INPUT: ${{ inputs.timeout_minutes }}
        run: |
          DIFF_LINES=$(gh pr diff "$PR_NUMBER" --repo "${GITHUB_REPOSITORY}" | wc -l | tr -d ' ')
          echo "Diff size: $DIFF_LINES lines"

          # --- Model selection ---
          if [ "$MODEL_INPUT" != "auto" ]; then
            MODEL="$MODEL_INPUT"
            echo "Model override: $MODEL"
          else
            MODEL="claude-sonnet-4-6"
            echo "Model: claude-sonnet-4-6"
          fi

          # --- Timeout estimation (v3) ---
          # The wall-clock `timeout-minutes` is the only hard safety net
          # since v3 dropped the --max-turns cap. The previous formula
          # derived timeout from max_turns × 30s × 1.44 buffer; with no
          # turn cap, we compute timeout directly from diff size:
          #
          #   TIMEOUT = max(10, 10 + lines/100)  capped at 30
          #
          # Floor raised from 4 → 10 min because the wall-clock is now
          # the SOLE mechanism that bounds a runaway / confused agent.
          # Subscription billing means an oversized timeout is free if
          # the agent finishes early; only actual elapsed time matters.
          # Generous is the right posture.
          #
          # Sample sizing:
          #   100-line diff   → 11 min
          #   1,000-line diff → 20 min
          #   2,000-line diff → 30 min (cap)
          if [ "$TIMEOUT_INPUT" -gt 0 ]; then
            TIMEOUT="$TIMEOUT_INPUT"
            echo "timeout_minutes override: $TIMEOUT"
          else
            TIMEOUT=$(( 10 + DIFF_LINES / 100 ))
            if [ "$TIMEOUT" -lt 10 ]; then TIMEOUT=10; fi
            if [ "$TIMEOUT" -gt 30 ]; then TIMEOUT=30; fi
            echo "Estimated timeout: ${TIMEOUT}m (from ${DIFF_LINES} diff lines)"
          fi

          echo "model=$MODEL" >> "$GITHUB_OUTPUT"
          echo "timeout_minutes=$TIMEOUT" >> "$GITHUB_OUTPUT"

          echo "### Review Parameters" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Diff lines | $DIFF_LINES |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Model | $MODEL |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Timeout | ${TIMEOUT}m |" >> "$GITHUB_STEP_SUMMARY"

      - name: Minimize prior review comments
        if: steps.doc-check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          # Collapse prior review comments tagged with the claude-blocking-review
          # marker. Keeps the PR conversation readable across multiple review
          # iterations (the AAR observed 4 stale reviews on kebab-tax#1165
          # polluting both the human-facing timeline and the post-push status
          # scraper). Non-fatal: any failure here must not block the review.
          OWNER="${REPO%/*}"
          NAME="${REPO#*/}"

          # `last: 100` (newest comments first) rather than `first:` (oldest)
          # so markers from recent review iterations are always inside the
          # window even on noisy PRs. Filter to our marker AND un-minimized
          # to keep this idempotent across repeated runs.
          # Use -f (explicit string) for owner/name — -F auto-detects types,
          # and a repo name that happens to parse as an integer would fail
          # the String! schema check.
          PRIOR_IDS=$(gh api graphql \
            -f query='query($owner: String!, $name: String!, $number: Int!) {
              repository(owner: $owner, name: $name) {
                pullRequest(number: $number) {
                  comments(last: 100) {
                    nodes { id body isMinimized }
                  }
                }
              }
            }' \
            -f owner="$OWNER" -f name="$NAME" -F number="$PR_NUMBER" \
            --jq '.data.repository.pullRequest.comments.nodes[] | select(.isMinimized == false) | select(.body | startswith("<!-- claude-blocking-review")) | .id' \
            2>/dev/null || echo "")

          if [ -z "$PRIOR_IDS" ]; then
            echo "No prior marked review comments to minimize."
            exit 0
          fi

          COUNT=0
          while IFS= read -r id; do
            [ -z "$id" ] && continue
            if gh api graphql \
                 -f query='mutation($id: ID!) { minimizeComment(input: {subjectId: $id, classifier: OUTDATED}) { clientMutationId } }' \
                 -f id="$id" >/dev/null 2>&1; then
              COUNT=$((COUNT + 1))
            else
              echo "::warning::Failed to minimize prior review comment $id"
            fi
          done <<< "$PRIOR_IDS"
          echo "Minimized $COUNT prior review comment(s) as OUTDATED."

      - name: Run Claude Code Review
        id: claude-review
        if: steps.doc-check.outputs.skip != 'true'
        timeout-minutes: ${{ fromJSON(steps.estimate.outputs.timeout_minutes) }}
        continue-on-error: true  # infrastructure failure must not block merges
        uses: anthropics/claude-code-action@v1
        with:
          # claude-code-action rejects non-User actors unless explicitly allowed.
          # Callers use this on pull_request events that fire for bot-opened PRs
          # (dependabot) and synchronize events triggered by bot pushes (claude,
          # github-actions). Named list only — see docs/security.md in the action
          # repo for why `*` is discouraged.
          allowed_bots: "claude[bot],github-actions[bot],dependabot[bot]"
          claude_code_oauth_token: ${{ secrets.claude_oauth_token }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ inputs.pr_number }}

            You are a BLOCK/PASS gate, not a full code reviewer. Local
            reviewers (pre-commit hooks, code-reviewer, adversarial-reviewer,
            linters, test suites) already cover style, naming, organization,
            test coverage, and documentation. Do NOT duplicate that work —
            it costs money and dilutes the signal of a real BLOCK.

            SCOPE CONSTRAINTS — follow these strictly. v3 dropped the
            artificial --max-turns cap, so YOU are the soft constraint
            keeping the review efficient. The wall-clock timeout is the
            only hard backstop, and burning it on exploration costs
            real subscription quota for no signal.

            - Read the PR diff with `gh pr diff` — that's your primary input
            - Read a changed file ONLY when you need execution-path context
              to confirm a specific BLOCK hypothesis — never for "general
              context", style check, or to prove a hunch you can already
              answer from the diff alone
            - Hard ceiling: if confirming a single hypothesis would require
              reading more than 3 files, stop and either downgrade to PASS
              with a named observation or BLOCK based on the evidence you
              already have. Do not chase a fourth file.
            - Do NOT read CLAUDE.md, README, or any doc — they describe
              style and conventions, which are not in scope
            - Do NOT explore the broader codebase, run tests, or investigate
              unrelated files
            - Complete your review in as few turns as possible. A tight
              PASS is a successful review; a thorough BLOCK is a successful
              review; a meandering exploration that runs out of wall-clock
              is a wasted review.

            Check the diff for these BLOCK criteria ONLY:
            - A clear bug that causes incorrect behavior in production
              (wrong calculation, incorrect condition, off-by-one affecting
              real data)
            - A reliability regression: a previously working feature or
              pipeline path may now fail because of changes in this PR
            - A security vulnerability: hardcoded credentials, unvalidated
              user input reaching a privileged operation, or an auth check
              that can be bypassed
            - Missing error handling on an async operation that would cause
              a silent failure or a raw exception surfaced to the user
            - A risk of data loss or data corruption

            If you find none of the above → VERDICT: PASS. Keep the review
            body short (≤5 lines is fine). Do NOT list style, naming,
            organization, or coverage observations — the local reviewers
            already caught or passed on those. Non-blocking observations
            here are noise that dilutes the PASS/BLOCK signal.

            If you find a BLOCK → cite file:line for each concern and
            explain the failure mode in one or two sentences. Evidence
            standard below is non-negotiable for reliability regressions.

            ${{ inputs.extra_instructions != '' && format('---\n\nAdditional instructions for this repository:\n\n{0}', inputs.extra_instructions) || '' }}

            ---

            EVIDENCE STANDARD FOR RELIABILITY REGRESSION BLOCKs:

            You cannot run the test suite. When claiming a test will fail or a code
            path will regress, you must trace the execution path from entry point to
            the specific assertion or failure point, with line-number citations at each
            step. If your trace relies on assumed execution order you have not verified
            in the diff or source, downgrade to PASS with a named observation instead.

              ❌ "validateEntitlements() is now called before CLAUDE_API_KEY is checked,
                 so the 503 test will fail." → Requires verifying actual call order. If
                 you cannot cite the lines proving that order, issue PASS.

              ✓ "Line 42 calls foo(), which at line 71 sets X to null; the assertion at
                 line 265 expects X to be non-null — that assertion will fail." → BLOCK.

              ✓ "The test fixture at line 48 does not set REVENUECAT_API_SECRET, but the
                 handler reads it at line 89 and returns early if absent — the test will
                 never reach the code path it claims to exercise." → BLOCK.

            When uncertain between BLOCK and PASS, default to PASS.

            You MUST complete ALL of the following steps in order. The verdict
            file is written BEFORE the comment post so that if you run out of
            turns or time during the comment post, CI still has a usable
            verdict. Do not reorder these steps.

            Step 1 — Write your review to /tmp/review.md

            Step 2 — Append the machine-readable verdict as the last line of the review:
              echo "" >> /tmp/review.md
              echo "VERDICT: PASS" >> /tmp/review.md
              # OR (if blocking issues found):
              echo "VERDICT: BLOCK" >> /tmp/review.md

            Step 3 — Write the verdict to the verdict file (PRIMARY signal for CI):
              echo "VERDICT: PASS" > /tmp/review-verdict.txt
              # OR:
              echo "VERDICT: BLOCK" > /tmp/review-verdict.txt

            Step 4 — Post the review as a PR comment. The body MUST begin with a
            machine-readable marker line, then a blank line, then the review
            content (which already ends with the VERDICT line from Step 2).
            Run these three commands verbatim — do NOT omit or edit the marker:

              printf '<!-- claude-blocking-review sha=%s run=%s -->\n\n' '${{ github.event.pull_request.head.sha || github.sha }}' '${{ github.run_id }}' > /tmp/review-final.md
              cat /tmp/review.md >> /tmp/review-final.md
              gh pr comment ${{ inputs.pr_number }} --body-file /tmp/review-final.md

            The marker lets downstream tooling (status scrapers, the
            "Minimize prior review comments" step on the next run) identify
            reviews produced by this workflow and associate each one with
            its reviewed commit. Omitting it breaks those consumers.

            The verdict file (Step 3) is the primary signal read by CI. The
            VERDICT line inside the posted comment (Step 2 / Step 4) is the
            fallback. Both must match.

          claude_args: '--model ${{ steps.estimate.outputs.model }} --allowed-tools "Read,Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(echo *),Bash(cat *),Bash(tee *),Bash(printf *)"'

      - name: Check review verdict
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          CLAUDE_OUTCOME: ${{ steps.claude-review.outcome }}
          DOC_SKIP: ${{ steps.doc-check.outputs.skip }}
        run: |
          # Short-circuit: doc-only diff already wrote its summary in the
          # Check for doc-only diff step. Nothing to verify, nothing to block.
          if [ "$DOC_SKIP" = "true" ]; then
            echo "Doc-only skip — no verdict required."
            exit 0
          fi

          # Escape hatch: [skip-claude-review] or [skip-claude-review: reason] in PR body
          # bypasses enforcement. The extended regex matches both the bare token and the
          # documented `: reason` form advertised by our error messages. See issue #38
          # for the prior -F fixed-string pattern that only matched the bare form.
          PR_BODY=$(gh pr view "$PR_NUMBER" --json body -q .body 2>/dev/null || echo "")
          if echo "$PR_BODY" | grep -qE '\[skip-claude-review(\]|:)'; then
            echo "::notice::Claude Code Review enforcement skipped via [skip-claude-review] marker in PR body."
            echo "## Claude Code Review" >> "$GITHUB_STEP_SUMMARY"
            echo "**Verdict:** SKIPPED (override in PR body)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          VERDICT_FILE="/tmp/review-verdict.txt"
          VERDICT=""

          if [ -f "$VERDICT_FILE" ]; then
            VERDICT=$(head -1 "$VERDICT_FILE")
            echo "Verdict source: file"
          else
            # Fallback: Claude sometimes includes the verdict in the comment body
            # instead of writing a separate file. Parse the most recent PR comment.
            # Anchor the grep to line start/end — the prompt instructs Claude to
            # emit the VERDICT line as the terminal line of the comment. An
            # unanchored match will hit any "VERDICT: BLOCK" or "VERDICT: PASS"
            # string in the review prose (e.g., when the review discusses the
            # verdict contract itself, as PR #47's self-review demonstrated).
            echo "::warning::Verdict file not found — falling back to PR comment parsing."
            COMMENT=$(gh pr view "$PR_NUMBER" --json comments -q '.comments[-1].body' 2>/dev/null || echo "")
            if echo "$COMMENT" | grep -qE '^VERDICT: BLOCK$'; then
              VERDICT="VERDICT: BLOCK"
              echo "Verdict source: PR comment (fallback)"
            elif echo "$COMMENT" | grep -qE '^VERDICT: PASS$'; then
              VERDICT="VERDICT: PASS"
              echo "Verdict source: PR comment (fallback)"
            else
              # No verdict found — distinguish exhaustion from infrastructure failure
              if [ "$CLAUDE_OUTCOME" = "failure" ]; then
                echo "::error::Review did not complete (likely exceeded turn limit or timed out). No verdict rendered."
                echo "::error::Re-push to retry, or add [skip-claude-review: reason] to the PR body to bypass."
                echo "## Claude Code Review" >> "$GITHUB_STEP_SUMMARY"
                echo "**Verdict:** INCOMPLETE — review exceeded turn limit or timed out." >> "$GITHUB_STEP_SUMMARY"
                echo "Re-push to retry or add \`[skip-claude-review: reason]\` to bypass." >> "$GITHUB_STEP_SUMMARY"
                exit 1
              else
                echo "::warning::No verdict found but Claude step did not fail. Defaulting to PASS (infrastructure issue)."
                echo "## Claude Code Review" >> "$GITHUB_STEP_SUMMARY"
                echo "**Verdict:** UNKNOWN (infrastructure issue — defaulting to PASS)" >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
            fi
          fi
          echo "Review verdict: $VERDICT"
          echo "## Claude Code Review" >> "$GITHUB_STEP_SUMMARY"

          if echo "$VERDICT" | grep -q "VERDICT: BLOCK"; then
            echo "**Verdict:** BLOCK" >> "$GITHUB_STEP_SUMMARY"
            echo "See the PR comment for details on the blocking issue(s)." >> "$GITHUB_STEP_SUMMARY"
            echo "To override after reviewing: add \`[skip-claude-review: reason]\` to the PR body." >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Claude Code Review found blocking issues. See the PR comment for details. To override: add [skip-claude-review: reason] to the PR body."
            exit 1
          elif echo "$VERDICT" | grep -q "VERDICT: PASS"; then
            echo "**Verdict:** PASS" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          else
            echo "::warning::Unexpected verdict format: '$VERDICT'. Expected 'VERDICT: PASS' or 'VERDICT: BLOCK'. Defaulting to PASS."
            echo "**Verdict:** UNKNOWN (unexpected format — defaulting to PASS)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
