name: Self Dependabot Auto-Merge

# Pins the released tag, not a local path, so unreleased changes never merge here.

# Fleet callers pin hand-moved tags, so a merge here reaches no other repo.

on: # zizmor: ignore[dangerous-triggers] required to run from base branch; no PR code executed here
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot-auto-merge:
    uses: smartwatermelon/github-workflows/.github/workflows/dependabot-auto-merge.yml@dependabot-auto-merge-v2
    with:
      trusted_namespaces: 'smartwatermelon'
