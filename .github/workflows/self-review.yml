name: Self-Review

# Repo-local guardrails run on this repo's own PRs.

# The self-applying Claude review caller was removed in #154.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  guard-no-checkout:
    # Plain-shell job, no LLM call involved. Guards the
    # dependabot-auto-merge.yml no-checkout invariant. Closes #64.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Fail if a pull_request_target workflow uses actions/checkout
        run: |
          # The reusable workflow and this repo's own caller of it both
          # run on pull_request_target.
          for file in .github/workflows/dependabot-auto-merge.yml \
                      .github/workflows/self-dependabot-auto-merge.yml; do
            if [ ! -f "$file" ]; then
              echo "::notice::${file} not found — nothing to check."
              continue
            fi
            # Skip comments: the header names actions/checkout on purpose.

            # Match only a real `uses:` step.
            if grep -v '^\s*#' "$file" | grep -qE 'uses:\s*actions/checkout'; then
              echo "::error::${file} must NEVER use actions/checkout."
              echo "::error::This workflow uses pull_request_target with no-checkout as its"
              echo "::error::core safety property. Adding actions/checkout would expose"
              echo "::error::base-branch secrets to externally-authored PR content. See the"
              echo "::error::header comment in dependabot-auto-merge.yml and issue #64."
              exit 1
            fi
            echo "No actions/checkout found in ${file} — guardrail passed."
          done

  markdownlint-drift:
    # standards/markdownlint.json vs dotfiles' canonical copy. Not required.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Compare with dotfiles markdownlint-cli/.markdownlint.json
        run: bash tests/test-markdownlint-drift.sh

  tests:
    # Every tests/test-*.sh, so a change to a reusable workflow is tested before its tag moves.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Same pins as standards-check.yml; change both together.
    env:
      SHELLCHECK_VERSION: "0.11.0"
      SHELLCHECK_SHA256: "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
      ZIZMOR_VERSION: "1.30.0"
      ZIZMOR_SHA256: "ec8c95cd800845abb9bbc5f377ec7c57d2eb8e2386a00a201d3a74ee4092e5ed"
      YAMLLINT_VERSION: "1.38.0"
      MARKDOWNLINT_CLI2_VERSION: "0.23.2"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install pinned linters
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.local/bin"; echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
          curl -Lfso /tmp/shellcheck.tar.xz \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  /tmp/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf /tmp/shellcheck.tar.xz -C /tmp
          install -m 0755 "/tmp/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" "${HOME}/.local/bin/shellcheck"
          curl -Lfso /tmp/actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  /tmp/actionlint.tar.gz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          install -m 0755 /tmp/actionlint "${HOME}/.local/bin/actionlint"
          curl -Lfso /tmp/zizmor.tar.gz \
            "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/zizmor-x86_64-unknown-linux-gnu.tar.gz"
          echo "${ZIZMOR_SHA256}  /tmp/zizmor.tar.gz" | sha256sum -c -
          mkdir -p /tmp/zizmor && tar -xzf /tmp/zizmor.tar.gz -C /tmp/zizmor
          install -m 0755 "$(find /tmp/zizmor -type f -name zizmor | head -1)" "${HOME}/.local/bin/zizmor"
          pipx install "yamllint==${YAMLLINT_VERSION}"
          npm install -g "markdownlint-cli2@${MARKDOWNLINT_CLI2_VERSION}"
          # yq and jq come with the runner image.
          yq --version && jq --version

      - name: Run the test suite
        run: bash tests/run-tests.sh
