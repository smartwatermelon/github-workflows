name: Claude Code Assistant

# Reusable workflow: invokes Claude Code Action when @claude is mentioned.
# The caller workflow is responsible for event triggers and the
# author_association guard that restricts who can invoke Claude.
#
# Usage in a caller workflow:
#
#   jobs:
#     claude:
#       if: |
#         (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)) ||
#         (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)) ||
#         (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.review.author_association))
#       permissions:
#         contents: read
#         issues: read
#         pull-requests: read
#         id-token: write # required by claude-code-action for internal authentication
#       uses: smartwatermelon/github-workflows/.github/workflows/claude-assistant.yml@v1
#       secrets:
#         claude_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

on:
  workflow_call:
    secrets:
      claude_oauth_token:
        description: 'Claude Code OAuth token (CLAUDE_CODE_OAUTH_TOKEN secret)'
        required: false

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write # required by claude-code-action for internal authentication
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          # See the matching note in claude-blocking-review.yml: nothing here
          # consumes the persisted credential. claude-code-action takes its
          # own github_token input and runs no git push/commit, so dropping
          # it removes exposure without removing capability (zizmor:
          # artipacked).
          persist-credentials: false

      - name: Verify CLAUDE_CODE_OAUTH_TOKEN is configured
        env:
          TOKEN_SET: ${{ secrets.claude_oauth_token != '' }}
        run: |
          # Deterministic (non-LLM) precondition check — fail fast and
          # loudly if the caller's CLAUDE_CODE_OAUTH_TOKEN secret is
          # missing, rather than letting claude-code-action fail deep in
          # its own error output with CLAUDE_OUTCOME: failure and no
          # actionable message (see #90 — mac-dev-server-setup#58 wasted a
          # CI cycle on exactly this before someone dug through logs to
          # find the missing secret).
          #
          # Deliberately unconditional (no `if:` gate) — unlike
          # claude-blocking-review.yml, this workflow has no doc-only/
          # Dependabot skip paths to gate behind. `required: false` on the
          # secrets: block above is NOT a signal that the token is
          # optional for this job to function: it exists solely to avoid
          # a GitHub dispatch-time validation quirk where `required: true`
          # combined with the CALLER's job-level `if:` (the @claude-mention
          # guard in claude.yml) causes startup_failure on every run,
          # including no-op runs where the job would correctly be skipped
          # (see 67630a7). By the time this reusable workflow's `run` job
          # actually executes, the caller has already confirmed @claude
          # was mentioned by an authorized user — there is no code path
          # here where the token is genuinely unnecessary. Every fleet
          # caller (confirmed via `gh search code`) passes
          # secrets.CLAUDE_CODE_OAUTH_TOKEN through unconditionally.
          if [ "$TOKEN_SET" != "true" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN secret is not set for this repository."
            echo "::error::Add it under Settings > Secrets and variables > Actions, or run /install-github-app from Claude Code."
            exit 1
          fi

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@9d7150bc8a3dae8149739a88019d192b579ad90c # v1.0.193
        with:
          # claude-code-action rejects non-User actors unless explicitly allowed.
          # The caller's author_association guard (OWNER/MEMBER/COLLABORATOR) is
          # the primary authorization — this list only names the bots that are
          # legitimate secondary triggers (e.g., claude[bot] updating a thread,
          # github-actions[bot] re-running after a synchronize push).
          allowed_bots: "claude[bot],github-actions[bot]"
          claude_code_oauth_token: ${{ secrets.claude_oauth_token }}

          # Required for Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Claude. If not specified, Claude
          # performs the instructions in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # Optional: restrict which tools Claude can use
          # claude_args: '--allowed-tools Bash(gh pr:*)'
