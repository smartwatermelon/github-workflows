name: Dependabot Auto-Merge

# Reusable workflow: merges every Dependabot PR once all its checks pass.
# Scope (v3, smartwatermelon/dev-env#229, #203):
#  - Only runs when the PR author is dependabot[bot], checked via
#    github.event.pull_request.user.login (not github.actor, which
#    zizmor flags as spoofable in other trigger contexts: it reflects
#    the last actor to touch the ref, not who opened the PR).
#  - Every PR merges only after all checks pass; a blocked PR is labeled. See README.
#
#  - Uses pull_request_target so the BASE-branch workflow runs, not
#    the PR branch's — a PR modifying this file cannot bypass itself.
#  - Never executes PR code; the only actions taken are `gh pr review`
#    and `gh pr merge`, both GitHub-side API calls. The diff is read
#    through the PR files API, never from a checkout.
#
#  - Labels use `gh pr edit` and `gh label create`, also API-only.
#
# DO NOT add `actions/checkout` to this workflow. It uses
# `pull_request_target`, which runs with base-branch secrets available.
# It is currently safe BECAUSE no PR-controlled code is ever executed —
# only API calls (fetch-metadata, gh pr review, gh pr merge). Checking
# out PR code here would expose those secrets to malicious dependency
# PRs (see the Ultralytics, nx, and tj-actions incidents). This
# invariant is also enforced by a CI guardrail — see self-review.yml's
# `guard-no-checkout` job in this repo. Closes #64.
#
# Callers pass MERGE_APP_CLIENT_ID and MERGE_APP_PRIVATE_KEY by name, never `secrets: inherit` (see README).
#
# `gh pr review --approve` satisfies branch-protection rules that
# require review; it's a no-op on repos where no approving review is
# required.
#
# Every `gh` call degrades to a ::warning:: or a label, never a red run (#87).
#
# Usage in a caller workflow:
#
#   permissions:
#     contents: write
#     pull-requests: write
#
#   jobs:
#     dependabot-auto-merge:
#       uses: smartwatermelon/github-workflows/.github/workflows/dependabot-auto-merge.yml@dependabot-auto-merge-v3
#       with:
#         sanity_checks: 'tests'  # checks that build or run the code; lint is not enough
#       secrets:
#         MERGE_APP_CLIENT_ID: ${{ secrets.MERGE_APP_CLIENT_ID }}
#         MERGE_APP_PRIVATE_KEY: ${{ secrets.MERGE_APP_PRIVATE_KEY }}
#
# Never `secrets: inherit` (see above).
#
# Versioning: this file uses a prefixed tag namespace
# (dependabot-auto-merge-v1, dependabot-auto-merge-v2, ...) rather
# than the bare v1/v2/v3 tags used elsewhere in this repo. Those bare
# tags are already live and consumed by claude-assistant.yml@v1; a
# second, unrelated file cannot safely "start its own v1" in the same
# repo-wide tag namespace.
#
# v3: all-checks gate. v3.1: merges as an App. v3.2: refuses downgrades; reads checks as the App. See README.

on:
  workflow_call:
    inputs:
      sanity_checks:
        description: >-
          Comma-separated check names, as `gh pr checks` shows them, that
          build or run the code (for example 'tests' or 'build'). Each must
          run and pass before a merge; a matrix job 'test (3.12)' matches
          'test'. Empty: nothing merges, and the PR is labeled
          dependabot-blocked:no-sanity-check.
        type: string
        required: false
        default: ''
      trusted_namespaces:
        description: >-
          Ignored since v3: every dependency goes through the same gate.
          Accepted for one release so v2 callers do not fail with
          "unexpected input"; removed in v4.
        type: string
        required: false
        default: ''
      allow_major:
        description: >-
          Ignored since v3: majors always merge through the gate.
          Accepted for one release so v2 callers do not fail with
          "unexpected input"; removed in v4.
        type: boolean
        required: false
        default: false
    secrets:
      # Not required, so a caller without them still runs: its PRs are
      # labeled dependabot-blocked:merge-failed instead of a red run (#87).
      MERGE_APP_CLIENT_ID:
        description: Client ID of the dependabot-merge-swm App.
        required: false
      MERGE_APP_PRIVATE_KEY:
        description: Private key of the dependabot-merge-swm App.
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    # user.login reflects who opened the PR and is not attacker-controllable
    # the way github.actor is (github.actor tracks the last committer on the
    # ref, which a human pushing to an existing Dependabot PR can spoof).
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    # Bounds the gate's wait (55 min deadline, settle included) with room to label.
    timeout-minutes: 70
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Verify caller permissions
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Preflight: fail loudly and
          # specifically if the caller didn't grant contents:write /
          # pull-requests:write, rather than letting `gh pr merge` fail
          # later with an unattributable error (the #87 failure mode).
          #
          # PR_NUMBER must be checked for emptiness FIRST (#94): if the
          # caller uses a non-pull_request-family trigger,
          # github.event.pull_request.number is empty, and
          # "repos/${REPO}/pulls/" (trailing slash, no number) is the
          # list-PRs endpoint — it returns HTTP 200 and would silently
          # pass this gate despite asserting nothing.
          if [[ -z "${PR_NUMBER}" ]]; then
            echo "::error::PR_NUMBER is empty — caller must use a pull_request or pull_request_target trigger."
            exit 1
          fi
          if ! gh api "repos/${REPO}/pulls/${PR_NUMBER}" --silent 2>/dev/null; then
            echo "::error::Permission check failed."
            echo "::error::The caller workflow must declare top-level permissions:"
            echo "::error::  contents: write, pull-requests: write"
            exit 1
          fi

      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3

      # Also the two downgrade checks (v3.2): metadata and diff, either one blocks.
      - name: Decide if PR can be evaluated
        id: policy
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PREV_VERSION: ${{ steps.metadata.outputs.previous-version }}
          NEW_VERSION: ${{ steps.metadata.outputs.new-version }}
          DEP_NAMES: ${{ steps.metadata.outputs.dependency-names }}
          DEPS_JSON: ${{ steps.metadata.outputs.updated-dependencies-json }}
          PR_BODY: ${{ github.event.pull_request.body }}
          SANITY_CHECKS: ${{ inputs.sanity_checks }}
          TRUSTED_NAMESPACES: ${{ inputs.trusted_namespaces }}
          ALLOW_MAJOR: ${{ inputs.allow_major }}
        run: |
          set -euo pipefail
          block() { # block REASON MESSAGE
            echo "decision=blocked" >> "$GITHUB_OUTPUT"
            echo "reason=$1" >> "$GITHUB_OUTPUT"
            echo "::notice::Not merged: $2"
            exit 0
          }
          extract_major() {
            printf '%s' "$1" | sed -E 's@^v?([0-9]+).*@\1@' | grep -E '^[0-9]+$' || echo ""
          }
          # vcmp OLD NEW: up, down, equal, prefix (tag family changed) or incomparable. Only "up" may merge.
          vcmp() {
            local o="${1#v}" n="${2#v}" op np oc nc os ns lo
            local re='^([0-9]+(\.[0-9]+)*)([-+.]?[0-9A-Za-z][0-9A-Za-z.+-]*)?$'
            # A commit SHA (whole, or after its leading letters) is never a version.
            for v in "$o" "$n" "${o#"${o%%[0-9]*}"}" "${n#"${n%%[0-9]*}"}"; do
              if [[ "$v" =~ ^[0-9a-f]{6,40}$ ]] && [[ "$v" =~ [a-f] ]]; then echo incomparable; return; fi
            done
            op="${o%%[0-9]*}"; np="${n%%[0-9]*}"
            o="${o#"$op"}"; n="${n#"$np"}"
            if [ -z "$o" ] || [ -z "$n" ]; then echo incomparable; return; fi
            if [ "$op" != "$np" ]; then echo prefix; return; fi
            for v in "$o" "$n"; do
              if [[ ! "$v" =~ $re ]]; then echo incomparable; return; fi
            done
            [[ "$o" =~ $re ]]; oc="${BASH_REMATCH[1]}"; os="${BASH_REMATCH[3]}"
            [[ "$n" =~ $re ]]; nc="${BASH_REMATCH[1]}"; ns="${BASH_REMATCH[3]}"
            if [ "$oc" = "$nc" ]; then
              # Same numeric base: a suffix (1.2.0-rc1) sorts before the plain release.
              if [ "$os" = "$ns" ]; then echo equal; return; fi
              if [ -z "$os" ]; then echo down; return; fi
              if [ -z "$ns" ]; then echo up; return; fi
              oc="$os"; nc="$ns"
            fi
            lo=$(printf '%s\n%s\n' "$oc" "$nc" | sort -V | head -n1)
            if [ "$lo" = "$oc" ]; then echo up; else echo down; fi
          }
          dep_count=$(printf '%s' "${DEP_NAMES:-}" \
            | tr ',' '\n' \
            | sed -E 's@^[[:space:]]+|[[:space:]]+$@@g' \
            | grep -c -v '^$' || true)
          # Fail closed if dependency-names is missing or whitespace-only:
          # without it the run cannot say what the PR updates.
          if [ "$dep_count" -eq 0 ]; then
            block cannot-evaluate "empty dependency-names ($PREV_VERSION -> $NEW_VERSION)"
          fi

          # Downgrade check 1: every dependency's metadata, so a group is covered in full.
          if ! deps=$(printf '%s' "${DEPS_JSON:-}" | jq -er '
              if type == "array" and length > 0 then . else error("no dependencies") end
              | .[] | [.dependencyName, .prevVersion, .newVersion]
              | map((. // "") | tostring | gsub("[\n\r\u001f]"; " ")) | join("\u001f")' 2>/dev/null); then
            block cannot-evaluate "unreadable updated-dependencies-json"
          fi
          while IFS=$'\037' read -r name old new; do
            # A parent upgrade can drop a package: no versions, and Dependabot's own "Removes `name`" line.
            if [ -z "$old" ] && [ -z "$new" ] && grep -qxF -- "Removes \`$name\`" <<< "${PR_BODY//$'\r'/}"; then
              echo "::notice::Downgrade check (metadata): $name removed (no longer needed by its parent)"
              continue
            fi
            verdict=$(vcmp "$old" "$new")
            if [ "$verdict" != up ]; then
              block downgrade "downgrade check: $name $old -> $new is $verdict, not an upgrade"
            fi
            echo "::notice::Downgrade check (metadata): $name $old -> $new is an upgrade"
          done <<< "$deps"

          # Downgrade check 2: the diff itself, read through the API (no PR code runs).
          if ! files=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}/files" --paginate 2>/dev/null) \
            || ! files=$(printf '%s' "$files" | jq -sce '
                if all(.[]; type == "array") then add else error("not arrays") end
                | if (. // []) | length > 0 then . else error("no files") end' 2>/dev/null); then
            block cannot-evaluate "could not read the PR's changed files"
          fi
          unread=$(printf '%s' "$files" | jq -r '.[] | select(.patch == null)
            | select(.filename | test("\\.ya?ml$"; "i")) | .filename' | paste -sd, -)
          if [ -n "$unread" ]; then
            block cannot-evaluate "no readable diff for $unread"
          fi
          changed=$(printf '%s' "$files" | jq -r 'to_entries[] | .key as $i
            | (.value.patch // "") | split("\n")[] | select(test("^[-+]")) | "\($i)\u001f\(.)"')
          # First-party pins move by hand only (dev-env#229 decision E).
          first=$(printf '%s\n' "$changed" | cut -d$'\037' -f2- \
            | grep -iE "^[-+][[:space:]]*(-[[:space:]]+)?uses:[[:space:]]*[\"']?smartwatermelon/github-workflows[/@]" \
            | sed -E 's@^([-+])[[:space:]]*(-[[:space:]]+)?uses:[[:space:]]*@\1 @' | paste -sd';' - || true)
          if [ -n "$first" ]; then
            block downgrade \
              "downgrade check: the diff changes a smartwatermelon/github-workflows pin ($first); it moves by hand"
          fi
          # Third-party pins: pair the k-th removed and k-th added line per file and action.
          uses_re="^([-+])[[:space:]]*(-[[:space:]]+)?uses:[[:space:]]*[\"']?([A-Za-z0-9_.-]+/[A-Za-z0-9_./-]+)@([^[:space:]\"'#]+)[\"']?([[:space:]]*#[[:space:]]*([^[:space:]]+))?"
          declare -A count=() old_ver=()
          pairs=()
          while IFS=$'\037' read -r file line; do
            [[ "$line" =~ $uses_re ]] || continue
            sign="${BASH_REMATCH[1]}"
            key="$file|${BASH_REMATCH[3],,}"
            ver="${BASH_REMATCH[6]:-${BASH_REMATCH[4]}}"
            k="$sign$key"
            i=${count[$k]:-0}
            count[$k]=$(( i + 1 ))
            if [ "$sign" = "-" ]; then
              old_ver["$key#$i"]="$ver"
            else
              pairs+=("$key#$i"$'\037'"$ver")
            fi
          done <<< "$changed"
          for p in "${pairs[@]}"; do
            slot="${p%%$'\037'*}"; new="${p#*$'\037'}"
            [ -n "${old_ver[$slot]+x}" ] || continue
            old="${old_ver[$slot]}"
            action="${slot#*|}"; action="${action%#*}"
            verdict=$(vcmp "$old" "$new")
            case "$verdict" in
              down|prefix)
                block downgrade "downgrade check: the diff moves $action $old -> $new ($verdict)" ;;
              # A bare SHA has no version to compare; the metadata check above covers it.
              *) echo "::notice::Downgrade check (diff): $action $old -> $new is $verdict" ;;
            esac
          done

          # Lint alone never proves the code still works (dev-env#229).
          if [ -z "$(printf '%s' "${SANITY_CHECKS:-}" | tr -d ',[:space:]')" ]; then
            block no-sanity-check "the caller names no sanity_checks (a check that builds or runs the code)"
          fi
          if [ -n "${TRUSTED_NAMESPACES:-}" ] || [ "${ALLOW_MAJOR:-false}" = "true" ]; then
            echo "::notice::trusted_namespaces and allow_major are ignored since v3; remove them from the caller"
          fi
          # For the log only: every outcome below goes through the gate.
          prev_major=$(extract_major "$PREV_VERSION")
          new_major=$(extract_major "$NEW_VERSION")
          if [ "$dep_count" -gt 1 ]; then
            kind="group of $dep_count"
          elif [ -z "$prev_major" ] || [ -z "$new_major" ]; then
            kind="unparseable version change"
          elif [ "$prev_major" = "$new_major" ]; then
            kind="patch/minor within v$prev_major"
          else
            kind="major v$prev_major -> v$new_major"
          fi
          echo "decision=gate" >> "$GITHUB_OUTPUT"
          echo "::notice::$kind ($DEP_NAMES: $PREV_VERSION -> $NEW_VERSION); merging after every check passes"

      # GITHUB_TOKEN cannot read private-repo check runs. Read-only, this repo; failure: merge-failed (#87).
      - name: Mint App token for check reads
        id: read-token
        if: steps.policy.outputs.decision == 'gate'
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.MERGE_APP_CLIENT_ID }}
          private-key: ${{ secrets.MERGE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-checks: read
          permission-statuses: read
          permission-pull-requests: read
          permission-contents: read

      # Every exit is gate=pass|blocked|superseded, never red (#87).
      - name: Wait for all checks
        id: gate
        if: steps.policy.outputs.decision == 'gate'
        env:
          # The App token lives 1 hour: WAIT_SECONDS (settle included) stays 5 min under it.
          GH_TOKEN: ${{ steps.read-token.outputs.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          RUN_ID: ${{ github.run_id }}
          SELF_WORKFLOW: ${{ github.workflow }}
          SANITY_CHECKS: ${{ inputs.sanity_checks }}
          SETTLE_SECONDS: '120'
          POLL_SECONDS: '30'
          WAIT_SECONDS: '3300'
        run: |
          set -euo pipefail
          stop() { # stop GATE REASON MESSAGE
            echo "gate=$1" >> "$GITHUB_OUTPUT"
            if [ -n "$2" ]; then echo "reason=$2" >> "$GITHUB_OUTPUT"; fi
            echo "::notice::Not merged: $3"
            exit 0
          }
          # No GITHUB_TOKEN fallback: on a private repo it reads a blank check list.
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::No App token to read checks. Pass MERGE_APP_CLIENT_ID and MERGE_APP_PRIVATE_KEY," \
              "and install the dependabot-merge-swm App on this repository."
            stop blocked merge-failed "No App token to read checks"
          fi
          # Names of failing checks on the base branch head, one per line.
          main_failing() {
            local runs statuses
            runs=$(gh api "repos/${REPO}/commits/${BASE_REF}/check-runs?per_page=100" --jq '.check_runs[]
              | select(.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out")
              | .name') || return 1
            statuses=$(gh api "repos/${REPO}/commits/${BASE_REF}/status" --jq '.statuses[]
              | select(.state == "failure" or .state == "error") | .context') || return 1
            printf '%s\n%s\n' "$runs" "$statuses"
          }
          sanity=$(printf '%s' "$SANITY_CHECKS" \
            | jq -Rsc '[splits("[,\n]")] | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0))')
          # The deadline counts from before the settle, so the wait never outlives the token.
          deadline=$(( $(date +%s) + WAIT_SECONDS ))
          # Netlify checks register late: settle, then need two identical finished polls.
          sleep "$SETTLE_SECONDS"
          last=""
          others=""
          pending=""
          missing=""
          while :; do
            if [ "$(date +%s)" -ge "$deadline" ]; then
              if [ "$others" = "0" ]; then
                stop blocked no-checks "only this workflow's checks ran; add a required check such as standards-check"
              fi
              if [ "$pending" = "0" ] && [ -n "$missing" ]; then
                stop blocked no-sanity-check "sanity checks never passed: ${missing//$'\037'/, }"
              fi
              stop blocked timeout "checks still running after $(( WAIT_SECONDS / 60 )) min"
            fi
            head=$(gh pr view "$PR_URL" --json headRefOid --jq .headRefOid 2>/dev/null || true)
            if [ -z "$head" ]; then
              # Nothing re-runs for this head, so an unreadable head must be labeled.
              stop blocked cannot-evaluate "could not read the PR head"
            fi
            if [ "$head" != "$HEAD_SHA" ]; then
              stop superseded "" "PR head is now '$head', not $HEAD_SHA; the run for the new head decides"
            fi
            # Exits nonzero while pending/failing; judge the JSON.
            json=$(gh pr checks "$PR_URL" --json name,workflow,bucket,link 2>/dev/null || true)
            # read collapses empty tab fields, so the two name lists carry an m:/b: prefix.
            # Names are joined with \u001f because job names can contain ", ".
            if ! summary=$(printf '%s' "$json" | jq -er \
                --arg run "/actions/runs/${RUN_ID}/" --arg wf "$SELF_WORKFLOW" --argjson sanity "$sanity" '
                if type != "array" then error("not an array") else . end
                | (map(select((.link // "") | contains($run))) | length) as $self
                | map(select(((.link // "") | contains($run)) | not)
                      | select((.workflow // "") != $wf)) as $o
                | ($o | map(select(.bucket == "fail" or .bucket == "cancel"))) as $bad
                | [ $self,
                    ($o | length),
                    ($o | map(select(.bucket as $b
                          | ["pass", "skipping", "fail", "cancel"] | index($b) | not))
                        | length),
                    ($bad | length),
                    ($o | map(select(.bucket == "pass")) | length),
                    ($o | map("\(.name)=\(.bucket)") | sort | join("|")),
                    ("m:" + ($sanity | map(. as $s | select(
                        [$o[] | select(.bucket == "pass"
                          and (.name == $s or (.name | startswith($s + " ("))))] | length == 0))
                      | join("\u001f"))),
                    ("b:" + ($bad | map(.name) | join("\u001f"))) ]
                | @tsv'); then
              stop blocked cannot-evaluate "could not read the PR's checks"
            fi
            IFS=$'\t' read -r self others pending bad passed sig missing bad_names <<< "$summary"
            missing="${missing#m:}"
            bad_names="${bad_names#b:}"
            if [ "$self" -eq 0 ]; then
              # Seeing itself proves the App token reads checks: the list is not a permission blank.
              stop blocked cannot-evaluate "this run cannot see its own check run (App lacks checks: read?)"
            fi
            if [ "$bad" -gt 0 ]; then
              # main-red: every failing check also fails on the base branch,
              # so the fix is on main, not in this PR. Unreadable -> red-check.
              reason=red-check
              if main_list=$(main_failing); then
                reason=main-red
                while IFS= read -r name; do
                  [ -z "$name" ] && continue
                  grep -qxF -- "$name" <<< "$main_list" || reason=red-check
                done < <(printf '%s\n' "$bad_names" | tr '\037' '\n')
              fi
              stop blocked "$reason" "failing or cancelled checks ($reason): ${bad_names//$'\037'/, }"
            fi
            if [ "$pending" -eq 0 ] && [ "$others" -ge 1 ]; then
              if [ "$sig" = "$last" ]; then
                if [ "$passed" -eq 0 ]; then
                  stop blocked no-checks "all $others other checks were skipped; nothing proved this head works"
                fi
                if [ -n "$missing" ]; then
                  # A late check may still register: keep polling until the deadline.
                  last=""
                  sleep "$POLL_SECONDS"
                  continue
                fi
                echo "gate=pass" >> "$GITHUB_OUTPUT"
                echo "::notice::All $others other checks finished with no failure on $HEAD_SHA"
                exit 0
              fi
              last="$sig"
            else
              last=""
            fi
            sleep "$POLL_SECONDS"
          done

      # Fresh token after the wait (the read token may be near its 1-hour end); failure: merge-failed (#87).
      - name: Mint merge App token
        id: app-token
        if: steps.gate.outputs.gate == 'pass'
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.MERGE_APP_CLIENT_ID }}
          private-key: ${{ secrets.MERGE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          # Most Dependabot PRs here change .github/workflows/.
          permission-workflows: write

      - name: Approve and merge
        id: merge
        if: steps.gate.outputs.gate == 'pass'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          gh pr review --approve "$PR_URL" \
            || echo "::warning::Approval failed (check can_approve_pull_request_reviews setting); continuing."
          # Clear labels an earlier run left; this head passed.
          stale=$(gh pr view "$PR_URL" --json labels --jq '.labels[].name' 2>/dev/null \
            | grep '^dependabot-blocked' | paste -sd, - || true)
          if [ -n "$stale" ]; then
            gh pr edit "$PR_URL" --remove-label "$stale" >/dev/null \
              || echo "::warning::Could not remove labels: $stale"
          fi
          # No GITHUB_TOKEN fallback: its merge starts no push workflows on main.
          if [ -z "${APP_TOKEN:-}" ]; then
            echo "reason=merge-failed" >> "$GITHUB_OUTPUT"
            echo "::warning::No merge App token. Pass MERGE_APP_CLIENT_ID and MERGE_APP_PRIVATE_KEY," \
              "and install the dependabot-merge-swm App on this repository."
            exit 0
          fi
          # Not --auto: it survives a rebase and then waits on required checks only.
          if ! GH_TOKEN="$APP_TOKEN" gh pr merge --squash --delete-branch \
              --match-head-commit "$HEAD_SHA" "$PR_URL"; then
            echo "reason=merge-failed" >> "$GITHUB_OUTPUT"
            echo "::warning::Merge failed — head moved, approval missing, or branch protection blocked it."
          fi

      - name: Label blocked PR
        if: >-
          steps.policy.outputs.decision == 'blocked'
          || steps.gate.outputs.gate == 'blocked'
          || steps.merge.outputs.reason == 'merge-failed'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          REASON: ${{ steps.merge.outputs.reason || steps.gate.outputs.reason || steps.policy.outputs.reason }}
        run: |
          set -uo pipefail
          case "${REASON:-}" in
            red-check|main-red|timeout|no-checks|no-sanity-check|cannot-evaluate|merge-failed|downgrade) ;;
            *) REASON=cannot-evaluate ;;
          esac
          want="dependabot-blocked:${REASON}"
          for label in dependabot-blocked "$want"; do
            gh label create "$label" --color D93F0B --force \
              --description "Dependabot auto-merge did not merge this PR; see the workflow run" >/dev/null \
              || echo "::warning::Could not create label $label"
          done
          # Drop a reason label left by an earlier run for another reason.
          stale=$(gh pr view "$PR_URL" --json labels --jq '.labels[].name' 2>/dev/null \
            | grep '^dependabot-blocked:' | grep -vxF "$want" | paste -sd, - || true)
          args=(--add-label "dependabot-blocked,${want}")
          if [ -n "$stale" ]; then args+=(--remove-label "$stale"); fi
          gh pr edit "$PR_URL" "${args[@]}" >/dev/null \
            || echo "::warning::Could not label the PR ${want}"
          echo "::notice::Labeled ${want}"
